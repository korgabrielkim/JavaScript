<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자바스크립트 첫 수업</title>
  </head>
  <body>
    <!-- 자바스크립트 첫 수업 -->
    <script>
      // 자바스크립트는 식과 문으로 구성
      // 식 : 표현식[연산식(+,- 등) 뿐만 아니라 실제 값 · 함수를 실행하는 모든 식]
      const inch = 2; // const는 선언하는 함수
      console.log(inch);
      ("안녕하세요"); // 문자열 → 표현식
      1 + 2; //숫자 - 연산식 → 표현식
      // 문 : 넓은 의미로 값이나 식까지 포함한다.
      // 조건문, 제어문 등을 예로 사용
      // 알림창 출력
      //alert("안녕하세요"); // alert : 자바스크립트 내부에 내제된 알림창 명령어.
      // 확인창 출력
      //confirm("여러분 지금 자바스크립트 쉬는 시간입니다.");
      // 입력창
      //prompt("당신의 생년월일은?", "yyyy-mm-dd");
      // 변수
      const name = "홍길동";
      const age = 20;
      const job = "선생님";
      // 화면출력
      document.write("선생님");
      document.write(`<h1>${name}</h1> <p>나이는 ${age}</p>`);
      document.write(`<h1>${name}</h1> <p>직업은 ${job}</p>`);
      document.write(`<h1>${name}</h1>`);
      document.write(`<h1>${name}</h1>`);
      document.write(`<h1>${name}</h1>`);
      document.write("<h1>" + name + "</h1>");
    </script>
  </body>
</html>
