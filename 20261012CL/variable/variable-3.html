<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>변수 예제</title>
  </head>
  <body>
    <script>
      // 1. banana 변수선언하고 금액을 할당하세요.
      // 2. apple 변수선언하고 금액을 할당하세요.
      // 3. mango 변수선언하고 금액을 할당하세요.
      // 4.  total변수 선언하고 banana apple mango 다 더한 식을 할당하세요
      // 화면에 바나나 사과 망고를 다 더한 금액은 ... 입니다.
      let banana = 3990;
      let apple = 6900;
      let mango = 8700;
      let total = banana + apple + mango;
      document.write(
        `<h1>바나나, 사과, 망고를 다 더한 금액은?</h1> ${total.toLocaleString()}원`,
      ); //tolocalestring은 숫자에 자동 쉼표를 부여하는 코드임.
    </script>
  </body>
</html>
