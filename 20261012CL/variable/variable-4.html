  <body>
    <script>
      let now = new Date(); //new Date() 날짜 코드
      console.log(now);
      let display = now.toLocaleDateString();
      console.log(display);
      document.write(`<p>오늘의 날짜는</p> ${display}`);
      let displaytime = now.toLocaleTimeString();
