<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>변수 2</title>
    <style>
      span {
        color: red;
      }
    </style>
  </head>
  <body>
    <script>
      //변수 연산
      let x = 200;
      let y = 50;
      let total = x * y; // %는 나머지 값을 의미함. ex) x % y
      console.log(total);
      document.write(`<h1>x와 y를 곱한 값은?</h1> ${total}`);
      let plus = x + y;
      document.write(`<h1>x와 y를 더한 값은?</h1> <span> ${plus} </span>`);
    </script>
  </body>
</html>
