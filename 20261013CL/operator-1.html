<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>연산자</title>
  </head>
  <body>
    <script>
      // 계산하거나 비교할 때 쓰는 기호
      //산술 연산자(계산)
      let a = 10;
      let b = 3;
      console.log(a + b);
      console.log(a - b);
      console.log(a * b);
      console.log(a / b);
      console.log(a % b); // 나머지 값

      // 비교 연산자
      console.log(5 > 3); // true ※ >= : 크거나 같다.
      console.log(5 < 3); // false
      console.log(5 == 5); // ==가 같다라는 의미임 ex) 여자는 여자 같다.
      console.log(5 === 5); // ===는 모든 속성이 완전히 같은지를 확인 ex) 박정현과 장윤정은 다르다.
      console.log(5 != 5); // 다르다는 의미. 즉 부정임. (값이 같지 않으면 true 결과값 도출)

      // 논리 연산자
      let age = 20;
      console.log(age > 18 && age < 30); // &&는 and의 의미임.
      console.log(age > 18 || age < 30); // ||는 or의 의미임.
      // ! 반대로 바꾸기
      let isLogin = true;
      console.log(!isLogin); // isLogin은 true 였지만, 앞에 !를 붙임으로 인해서 False로 결과 값이 반전됨.

      // 증가 · 감소 연산자
      let count = 5;
      count++; // ++ : 증가
      console.log(count);
      count--; // -- : 감소
      console.log(count);
    </script>
  </body>
</html>
