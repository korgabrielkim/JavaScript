<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>현재 시간</title>
  </head>
  <body>
    <p>
      현재 시각 :
      <strong class="display">
        <!-- JS출력 -->
      </strong>
    </p>
    <script>
      // 현재 시간을 나타내는 함수 세팅
      function displayNow() {
        // console.log("확인");
        let now = new Date();
        // console.log(now);
        const currentTime = now.toLocaleTimeString();
        // console.log(currentTime);
        const display = document.querySelector(".display");
        // console.log(display);
        display.innerHTML = `${currentTime}`;
      }
      // function displayNow()는 추가적으로 함수 호출을 해야 함.
      // displayNow();
      // setInterval() : 일정시간 간격으로 반복 실행하는 함수
      setInterval(displayNow, 1000); // 자바스크립트에는 1000이 1초임
    </script>
  </body>
</html>
