<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <script>
      let fruits = ["사과", "바나나", "포도", "망고", "수박"];

        document.write(`<p>${index + 1} : ${fruits}</p>`);
      });
    </script>
